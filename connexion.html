<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion | Kabakaro Dev</title><link rel="stylesheet" href="espace-client.css"></head>
<body><div class="shell">
<header class="header"><a class="brand" href="index.html">KK<span>.</span></a><nav><a href="creer-mon-cv.html">Créer un CV</a><a href="index.html">Portfolio</a></nav></header>
<div class="auth-grid">
<section class="card"><h1>Connexion</h1><p class="muted">Retrouvez vos CV enregistrés sur tous vos appareils.</p>
<form id="loginForm"><label>Email<input id="loginEmail" type="email" required autocomplete="email"></label>
<label>Mot de passe<input id="loginPassword" type="password" required autocomplete="current-password"></label>
<p class="message" id="loginMsg"></p><button class="btn primary" type="submit">Se connecter</button></form></section>

<section class="card"><h2>Créer un compte</h2><p class="muted">Créez gratuitement votre espace Kabakaro Dev.</p>
<form id="registerForm"><div class="grid2"><label>Prénom<input id="regFirst" required></label><label>Nom<input id="regLast" required></label></div>
<label>Email<input id="regEmail" type="email" required autocomplete="email"></label>
<label>Mot de passe<input id="regPassword" type="password" minlength="8" required autocomplete="new-password"></label>
<p class="message" id="regMsg"></p><button class="btn primary" type="submit">Créer mon compte</button></form></section>
</div></div><script src="auth-client.js"></script></body></html>
