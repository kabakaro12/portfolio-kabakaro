name: Apply Portfolio V18

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v18:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V18
        run: python3 apply_v18.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html style.css
          git add index.v17-backup.html style.v17-backup.css || true

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply portfolio V18"
            git push
          fi
